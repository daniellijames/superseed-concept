const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);

    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;

                run = [index];

            run = null;

function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);

        }
    }
    let bevel;
    if (options.bevel && options.bevel > 0) {
        const by = options.bevel;
        const inset = ring.map(([x, y], index) => {
            const [ax, ay] = normals[(index + count - 1) % count];
            const [bx, by2] = normals[index];
            const mx = ax + bx;

  vanBox = [x - hx, y - hy, x + hx, y + hy];
  // slot the van between what is behind it and what is in front
  const behind = (a, b) => {
    if (a[2] <= b[0]) return view[0] > 0;
    if (b[2] <= a[0]) return view[0] < 0;
    if (a[3] <= b[1]) return view[1] > 0;
    if (b[3] <= a[1]) return view[1] < 0;
    return depthOf([(a[0] + a[2]) / 2, (a[1] + a[3]) / 2, 0], P) < depthOf([(b[0] + b[2]) / 2, (b[1] + b[3]) / 2, 0], P);
  };
  let before = null;
  for (const item of statics) if (behind(vanBox, item.box)) { before = item.el; break; }
  if (before) { if (vanEl.nextSibling !== before) layer.insertBefore(vanEl, before); }

}

// ── routes: legs with a trapezoid speed profile ──
const VMAX = 190, ACC = 520;
function prep(legs) {
  return legs.map((leg) => {
    const cum = [0];
    for (let i = 1; i < leg.pts.length; i++) cum.push(cum[i - 1] + Math.hypot(leg.pts[i][0] - leg.pts[i - 1][0], leg.pts[i][1] - leg.pts[i - 1][1]));
    const len = cum[cum.length - 1];
    const v = leg.rev ? VMAX * 0.35 : VMAX;
    const ta = v / ACC;
    const tri = len < v * ta;
    const T = tri ? 2 * Math.sqrt(len / ACC) : len / v + ta;
    return { ...leg, cum, len, v, ta, tri, T };
  });
}
function distAt(leg, t) {
  if (t >= leg.T) return leg.len;
  if (leg.tri) { const h = leg.T / 2; return t < h ? 0.5 * ACC * t * t : leg.len - 0.5 * ACC * (leg.T - t) ** 2; }
  if (t < leg.ta) return 0.5 * ACC * t * t;
  if (t > leg.T - leg.ta) return leg.len - 0.5 * ACC * (leg.T - t) ** 2;
  return 0.5 * ACC * leg.ta * leg.ta + (t - leg.ta) * leg.v;
}
function poseOn(leg, d) {
  const { pts, cum } = leg;
  let i = 1;
  while (i < cum.length - 1 && cum[i] < d) i++;
  const f = cum[i] === cum[i - 1] ? 0 : (d - cum[i - 1]) / (cum[i] - cum[i - 1]);
  const a = pts[i - 1], b = pts[i];
  // heading from a short window around the point, so corners turn smoothly
  const look = (dd) => { let j = 1; while (j < cum.length - 1 && cum[j] < dd) j++; const g = cum[j] === cum[j - 1] ? 0 : (dd - cum[j - 1]) / (cum[j] - cum[j - 1]); const p = pts[j - 1], q = pts[j]; return [p[0] + (q[0] - p[0]) * g, p[1] + (q[1] - p[1]) * g]; };
  const p0 = look(Math.max(0, d - 2.5)), p1 = look(Math.min(leg.len, d + 2.5));
  let h = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]);
  if (leg.rev) h += Math.PI;
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, h];
}
const routeTime = (legs) => legs.reduce((sum, leg) => sum + leg.T + leg.dwell, 0);
const TODAY_LEGS = prep(TODAY);
const WITH_LEGS = Object.fromEntries(Object.entries(WITH).map(([key, legs]) => [key, prep(legs)]));

// ── state ──
stage.dataset.todayT = routeTime(TODAY_LEGS).toFixed(2) + " " + Object.values(WITH_LEGS).map(routeTime).map((t) => t.toFixed(2)).join(" ");
let mode = "today";         // what the figure shows (readout, lamps)
let touring = true;         // idle tour until the parent speaks
let route = null, legIndex = 0, legClock = 0, inDwell = false;
let phaseClock = 0;         // time since the current mode began
let alertIndex = -1, alertCount = 0, fixed = -1, lastArrive = -1;
let lampOn = 0, lampVel = 0;
let pose = [BAY[0], BAY[1], Math.PI / 2];
let frame = 0, last = 0, visible = false;

function setMode(next, fromParent) {
  if (fromParent) touring = false;
  if (next !== "today" && next !== "with") return;
  if (next === mode && !fromParent) return;
  if (next === mode) return;
  mode = next;
  phaseClock = 0;
  alertIndex = -1; fixed = -1;
  if (root.dataset.state !== mode) root.dataset.state = mode;
  readout.textContent = TEXT[mode];
  if (hint) hint.textContent = HINT[mode];
  stage.setAttribute("aria-valuetext", HINT[mode] + ": " + TEXT[mode].toLowerCase());
  if (still.matches) { route = null; draw(0); }
  run();
}
function startRoute(legs) { route = legs; legIndex = 0; legClock = 0; inDwell = false; lastArrive = -1; }

function step(dt) {
  phaseClock += dt;
  if (route) {
    legClock += dt;
    const leg = route[legIndex];
    if (!inDwell && legClock >= leg.T) { inDwell = true; legClock -= leg.T; if (leg.arrive !== undefined) { fixed = leg.arrive; alertIndex = -1; } }
    if (inDwell && legClock >= leg.dwell) {
      legClock -= leg.dwell; inDwell = false; legIndex++;
      if (legIndex >= route.length) { route = null; pose = [BAY[0], BAY[1], Math.PI / 2]; phaseClock = Math.max(phaseClock, 0); }
    }
    if (route) { const L2 = route[legIndex]; pose = poseOn(L2, inDwell ? L2.len : distAt(L2, legClock)); }
  }
  if (!route) {
    if (mode === "today") {
      if (touring && phaseClock > 8.2 && phaseClock > 1) { setMode("with"); return; }
      if (phaseClock > 0.5 && (!touring || phaseClock < 7)) { startRoute(TODAY_LEGS); }
      else if (phaseClock > 0.5 && phaseClock >= 7 && touring) { setMode("with"); }
    } else {
      // with: lamps settle amber, then one blinks and the van goes there
      const cycle = touring ? 10.5 : 9;
      if (alertIndex < 0 && fixed < 0 && phaseClock > 2.3) { alertIndex = ALERTS[alertCount % ALERTS.length]; alertCount++; }
      if (alertIndex >= 0 && phaseClock > 3.8 && !route) startRoute(WITH_LEGS[alertIndex]);
      if (fixed >= 0 && phaseClock > cycle) {
        if (touring) setMode("today");
        else { phaseClock = 0.6; fixed = -1; }
      }
    }
  }
}

function draw(clock) {
  const target = mode === "with" ? 1 : 0;
  if (still.matches) { lampOn = target; lampVel = 0; }
  else { const w = 1 / 0.45; lampVel += (w * w * (target - lampOn) - 2 * w * lampVel) * Math.min(clock, 1 / 30); lampOn += lampVel * Math.min(clock, 1 / 30); }
  const t = performance.now() / 1000;
  lamps.forEach((el, index) => {
    // stagger so the region lights site by site
    const stag = Math.min(1, Math.max(0, lampOn * 1.6 - index * 0.085));
    let on = stag * 0.86, glow = stag * 0.3;
    if (index === alertIndex && !still.matches) {
      const b = 0.5 + 0.5 * Math.sin(t * Math.PI * 2 * 1.1 - Math.PI / 2);
      on = 0.45 + 0.55 * b; glow = 0.2 + 0.8 * b;
      el.style.setProperty("--swell", (1 + 0.6 * b).toFixed(3));
    }
    el.style.setProperty("--on", on.toFixed(3));
    el.style.setProperty("--glow", glow.toFixed(3));
    el.style.setProperty("--q", (1 - stag).toFixed(3));
    if (index !== alertIndex) el.style.setProperty("--swell", "1");
  });
  placeVan(pose[0], pose[1], pose[2]);
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  if (!still.matches) step(dt);
  draw(dt);
  frame = visible && !still.matches ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

// parent control: postMessage or the attribute on <html>
addEventListener("message", (event) => {
  const data = event.data;
  if (data && data.type === "field-state" && (data.state === "today" || data.state === "with")) setMode(data.state, true);
});
new MutationObserver(() => { const s = root.dataset.state; if (s && s !== mode) setMode(s, true); }).observe(root, { attributes: true, attributeFilter: ["data-state"] });

// optional nudge: click or arrow keys flip the state
const flip = () => setMode(mode === "today" ? "with" : "today", true);
stage.addEventListener("click", flip);
stage.addEventListener("keydown", (event) => {
  if (["ArrowLeft", "ArrowRight", "Enter", " "].includes(event.key)) { event.preventDefault(); flip(); }
});

// height for the parent iframe
const postHeight = () => { try { parent.postMessage({ type: "anatomy-height", height: document.body.scrollHeight }, "*"); } catch (e) {} };
addEventListener("load", postHeight);
addEventListener("resize", postHeight);
new ResizeObserver(postHeight).observe(document.body);
postHeight();

if (still.matches) { mode = "today"; setMode("with"); touring = false; draw(0); }
else { root.dataset.state = mode; draw(0); }
</script></body></html>
