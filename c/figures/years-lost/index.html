*{box-sizing:border-box}

body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

html,body{background:transparent!important;color-scheme:dark}
body{margin:0}
.iso-page{width:100%;max-width:880px;margin:0 auto;padding:0}
.iso{
  --ink:oklch(14% .01 60);--amber:oklch(76% .15 62);--cream:oklch(96% .014 85);
  --anatomy-card:var(--ink);--anatomy-paper:var(--ink);

  --anatomy-shade-0:oklch(23% .008 60);--anatomy-shade-1:oklch(26% .008 60);--anatomy-shade-2:oklch(29% .009 62);--anatomy-shade-3:oklch(32% .009 62);
  --anatomy-lit-top:oklch(42% .01 70);--anatomy-lit-shade:oklch(33% .01 70);
  --anatomy-hi:oklch(90% .012 80);--anatomy-mid:oklch(64% .01 72);--anatomy-lo:oklch(47% .01 68);--anatomy-faint:oklch(37% .01 64);--anatomy-lit:var(--cream);

.iso-figure{margin:0}
.iso-plate{box-shadow:0 0 0 1px oklch(30% .01 60);border-radius:14px;padding:50px 22px 70px}

.yl-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px 26px}

.yl-dust-film{fill:oklch(70% .01 75)}

const CH_A0 = -120, CH_A1 = 120, THERMO = {"top":34,"bulb":94,"t0":20,"t1":45};
const root = document.querySelector(".iso-plate");
const stage = document.querySelector(".iso-stage");
const panels = [...stage.querySelectorAll(".yl-panel")];
const q = (i, n) => panels[i].querySelector('[data-part="' + n + '"]');
const blocks = panels.map((p) => [...p.querySelectorAll(".yl-blocks b")]);
const thRead = q(0, "th-read"), thCol = q(0, "th-col"), heat = [0, 1, 2].map((j) => q(0, "heat" + j));
const chNeedle = q(1, "ch-needle"), chLamp = q(1, "ch-lamp"), rust = [...q(1, "rust").children];
const lampLight = q(2, "lamp-light"), lampPool = q(2, "lamp-pool"), gNeedle = q(2, "g-needle"), gFill = q(2, "g-fill"), gE = q(2, "g-e");
const calTop = q(3, "cal-top"), calUnder = q(3, "cal-under"), dustFilm = q(3, "dust-film"), dust = [...q(3, "dust").querySelectorAll("circle")];
const topMonth = calTop.querySelector("[data-month]"), underMonth = calUnder.querySelector("[data-month]");
const phaseEl = document.querySelector("[data-phase]"), subEl = document.querySelector("[data-sub]"), live = document.querySelector("[data-live]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sm = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const NAMES = ["Too hot","Charger set wrong","Drained too far","Never checked"];
const START = 1.0, SLOT = 3.4, RUN = 3.1, END = START + 4 * SLOT, HOLD = 4.4, LOOP = END + HOLD + 1.4;
// each cause as a pure function of its own progress u (0 → 1): what the cause object shows, and how many years have faded (0 → 5)
const cause = [
  (u) => { const e = sm(0, 1, u); return { temp: 25 + 15 * e, heat: sm(0.08, 0.6, u), lost: 5 * sm(0.05, 1, u) }; },
  (u) => ({ dial: -40 + 132 * sm(0, 0.85, u), rust: sm(0.3, 1, u), lost: 5 * sm(0.12, 1, u) }),
  (u) => { const charge = u < 0.42 ? 1 - sm(0, 0.36, u) : u < 0.6 ? sm(0.42, 0.58, u) : 1 - sm(0.6, 0.94, u); return { charge, lost: 2.5 * sm(0.3, 0.44, u) + 2.5 * sm(0.88, 1, u) }; },
  (u) => ({ page: 6 * clamp(u / 0.96, 0, 1), dust: sm(0, 1, u), lost: 5 * clamp(u / 0.97, 0, 1) }),
];
function stateAt(t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  const reset = t > LOOP - 0.7;               // second half of the dip: everything back to new
  const us = [0, 1, 2, 3].map((i) => reset ? 0 : clamp((t - START - i * SLOT) / RUN, 0, 1));
  let active = -1;
  for (let i = 0; i < 4; i++) if (t >= START + i * SLOT - 0.25 && t < START + i * SLOT + SLOT - 0.25) active = i;
  const phase = t < START - 0.25 || reset ? -1 : active >= 0 ? active : 4;
  const dip = sm(LOOP - 1.4, LOOP - 0.7, t) * (1 - sm(LOOP - 0.7, LOOP, t));
  return { us, active, phase, dip, t };
}
const FINAL = { us: [1, 1, 1, 1], active: -1, phase: 4, dip: 0, t: 0 };
const PHASES = ["Built for 10 years"].concat(NAMES, ["All four causes"]);
const SUBS = ["Years of life: 10 of 10"].concat(NAMES.map((n, i) => "Cause " + (i + 1) + " of 4"), ["None of it seen"]);
let shown = null, shownActive = null;
function strip(i, lost) {
  const b = blocks[i];
  for (let j = 0; j < 10; j++) {
    const fade = clamp(lost - (9 - j), 0, 1);
    b[j].style.opacity = (1 - fade).toFixed(3);
    b[j].style.setProperty("--hurt", (Math.sin(Math.PI * fade) * 100).toFixed(1) + "%");
  }
}
function draw(s) {
  const c = s.us.map((u, i) => cause[i](u));
  // 1 · thermometer and heat
  const temp = c[0].temp, top = THERMO.bulb - 8 - ((temp - THERMO.t0) / (THERMO.t1 - THERMO.t0)) * (THERMO.bulb - 8 - THERMO.top - 4);
  thCol.setAttribute("y", top.toFixed(2)); thCol.setAttribute("height", (THERMO.bulb - top).toFixed(2));
  thRead.textContent = Math.round(temp) + "°C";
  thRead.style.setProperty("--hot", (sm(25, 40, temp) * 100).toFixed(0) + "%");
  heat.forEach((h, j) => { const ph = ((s.t * 0.42 + j * 0.33) % 1); h.setAttribute("opacity", (c[0].heat * Math.sin(Math.PI * ph) * 0.9).toFixed(3)); h.setAttribute("transform", "translate(0 " + (-ph * 12).toFixed(2) + ")"); });
  // 2 · charger dial and crust
  chNeedle.setAttribute("transform", "rotate(" + c[1].dial.toFixed(2) + ")");
  chLamp.classList.toggle("on", c[1].dial > 46);
  rust.forEach((d) => d.setAttribute("opacity", sm(+d.dataset.at * 0.8, +d.dataset.at * 0.8 + 0.2, c[1].rust).toFixed(3)));
  // 3 · charge gauge
  const ch = c[2].charge;
  gNeedle.setAttribute("transform", "rotate(" + (-62 + 124 * ch).toFixed(2) + ")");
  gFill.setAttribute("stroke-dasharray", (ch * 100).toFixed(2) + " 100");
  gFill.classList.toggle("low", ch < 0.25);
  gE.classList.toggle("on", ch < 0.06);
  const glow = sm(0.02, 0.5, ch);
  lampLight.setAttribute("opacity", glow.toFixed(3)); lampPool.setAttribute("opacity", (0.22 * glow).toFixed(3));
  // 4 · calendar pages and dust
  const pg = c[3].page, n = Math.floor(pg), fl = sm(0.15, 0.85, pg - n);
  topMonth.textContent = MONTHS[n % 12]; underMonth.textContent = MONTHS[(n + 1) % 12];
  calTop.setAttribute("transform", "translate(0 9) scale(1 " + (1 - 1.15 * fl).toFixed(3) + ") translate(0 -9)");
  calTop.setAttribute("opacity", (1 - sm(0.5, 1, fl)).toFixed(3));
  dust.forEach((d) => d.setAttribute("opacity", sm(+d.dataset.at * 0.85, +d.dataset.at * 0.85 + 0.15, c[3].dust).toFixed(3)));
  dustFilm.setAttribute("opacity", (0.2 * c[3].dust).toFixed(3));
  // strips
  c.forEach((x, i) => strip(i, x.lost));
  // which panel the eye should be on
  if (s.active !== shownActive) { shownActive = s.active; panels.forEach((p, i) => { p.classList.toggle("on", i === s.active); p.classList.toggle("off", s.active >= 0 && i !== s.active); }); }
  stage.style.opacity = (1 - 0.75 * s.dip).toFixed(3);
  if (s.phase !== shown) { shown = s.phase; phaseEl.textContent = PHASES[s.phase + 1]; subEl.textContent = SUBS[s.phase + 1]; root.dataset.phase = String(s.phase); if (document.activeElement === stage) live.textContent = PHASES[s.phase + 1]; }
}
let frame = 0, last = 0, clock = 0, visible = false;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now; clock += dt;
  draw(stateAt(clock));
  frame = visible ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); else if (frame) { cancelAnimationFrame(frame); frame = 0; } }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("focus", () => { live.textContent = PHASES[(shown ?? -1) + 1]; });
if (still.matches) draw(FINAL); else draw(stateAt(0));
still.addEventListener("change", () => { if (still.matches) { if (frame) cancelAnimationFrame(frame); frame = 0; draw(FINAL); } else run(); });
const post = () => { try { window.parent.postMessage({ type: "anatomy-height", height: document.body.scrollHeight }, "*"); } catch (_) {} };
addEventListener("load", post); addEventListener("resize", post);
new ResizeObserver(post).observe(document.body);
post();
