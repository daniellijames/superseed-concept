const EX = [1.5170959022362922,0.34737943209935906], EY = [-0.7399371115003817,0.7122333841189459], EZ = [0,-1.4903482956203504];
const tr = (x, y, z) => "translate(" + (EX[0] * x + EY[0] * y + EZ[0] * z).toFixed(2) + " " + (EX[1] * x + EY[1] * y + EZ[1] * z).toFixed(2) + ")";
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sm = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const still = matchMedia("(prefers-reduced-motion: reduce)");
const wd = document.querySelector(".wd");
const rows = [...document.querySelectorAll(".wd-row")];
const countEl = document.querySelector("[data-count]");

const part = (scene, name) => document.querySelector('[data-scene="' + scene + '"] [data-part="' + name + '"]');
const op = (el, v) => el && el.setAttribute("opacity", clamp(v, 0, 1).toFixed(3));
const draw = (el, v) => { if (!el) return; v = clamp(v, 0, 1); el.style.strokeDashoffset = (1 - v).toFixed(3); el.style.opacity = v > 0.01 ? "1" : "0"; };
const setLamp = (el, c, on = 1) => { if (!el) return; el.dataset.c = c; el.setAttribute("opacity", on.toFixed(3)); };

// each scene: p in 0..1 (0 = before, 1 = done), t = seconds for small idle wobbles
const S = {
  "0L"(p, t) {
    const van = part("0L", "van-wrap"), tech = part("0L", "tech"), probe = part("0L", "probe"), meter = part("0L", "meter");
    const a = sm(0, 0.45, p);
    van.setAttribute("transform", tr(-70 * (1 - a), 0, 0)); op(van, sm(0, 0.2, p));
    const b = sm(0.4, 0.75, p);
    tech.setAttribute("transform", tr(-26 * (1 - b), -6 * (1 - b), 0)); op(tech, sm(0.4, 0.5, p));
    op(probe, sm(0.75, 0.85, p));
    meter.classList.toggle("on", p > 0.85 && (p >= 1 || Math.floor(t * 3) % 2 === 0));
  },
  "0R"(p, t) {
    setLamp(part("0R", "lamp1"), "green", sm(0, 0.12, p));
    const sig = part("0R", "signal");
    sig.style.opacity = (sm(0.08, 0.2, p) * (1 - 0.55 * sm(0.55, 0.7, p))).toFixed(3);
    sig.style.strokeDashoffset = (-t * 14).toFixed(1);
    draw(part("0R", "scr-big"), sm(0.25, 0.45, p));
    for (let i = 0; i < 7; i++) draw(part("0R", "scr-d" + i), sm(0.4 + i * 0.075, 0.47 + i * 0.075, p));
  },
  "1L"(p, t) {
    const blink = p >= 1 ? 1 : 0.55 + 0.45 * Math.cos(t * 7);
    setLamp(part("1L", "warn2"), "red", sm(0.1, 0.22, p) * blink);
    const b = part("1L", "batt2"); b.style.filter = p > 0.12 ? "brightness(" + (1 - 0.25 * sm(0.12, 0.3, p)).toFixed(3) + ")" : "";
    const ringing = sm(0.35, 0.45, p);
    const ph = part("1L", "phone");
    ph.setAttribute("transform", p < 1 && ringing > 0 ? "translate(" + (Math.sin(t * 60) * 0.9 * ringing).toFixed(2) + " 0)" : "");
    for (let i = 0; i < 3; i++) {
      const el = part("1L", "ring" + i);
      const w = p >= 1 ? 1 : 0.5 + 0.5 * Math.sin(t * 6 - i * 0.9);
      op(el, ringing * (0.35 + 0.65 * w));
    }
  },
  "1R"(p, t) {
    const lamp = part("1R", "lamp2");
    const fixed = p > 0.78;
    setLamp(lamp, fixed ? "green" : "amber", fixed ? 1 : (p < 0.05 ? 0.35 : 0.65 + 0.35 * Math.cos(t * 3.4)));
    const eng = part("1R", "eng");
    const a = sm(0.02, 0.38, p);
    eng.setAttribute("transform", tr(34 * (1 - a), 8 * (1 - a), 0)); op(eng, sm(0, 0.12, p));
    const w = p > 0.4 && p < 0.78 ? Math.abs(Math.sin((p - 0.4) * 30)) : 0;
    part("1R", "spanner").setAttribute("transform", tr(0, 0, 2.4 * w));
  },
  "2L"(p) {
    for (let i = 0; i < 10; i++) {
      const s = 0.04 + i * 0.05, k = sm(s, s + 0.1, p);
      const rb = part("2L", "rb" + i); op(rb, 1 - k); rb.setAttribute("transform", tr(0, 12 * k, 4 * k));
      const tb = part("2L", "tb" + i); op(tb, k); tb.setAttribute("transform", tr(0, -6 * (1 - k), 8 * (1 - k)));
    }
    part("2L", "trolley").setAttribute("transform", tr(6 * sm(0.66, 1, p), 0, 0));
  },
  "2R"(p) {
    const old = part("2R", "old"), nw = part("2R", "new");
    old.classList.toggle("lit", p > 0.02 && p < 0.5);
    const a = sm(0.15, 0.5, p);
    old.setAttribute("transform", tr(0, 22 * a, 3 * Math.sin(Math.PI * a))); op(old, 1 - sm(0.38, 0.5, p));
    const b = sm(0.5, 0.92, p);
    nw.setAttribute("transform", tr(0, 22 * (1 - b), 3 * Math.sin(Math.PI * b))); op(nw, sm(0.5, 0.6, p));
  },
  "3L"(p) {
    for (let i = 0; i < 11; i++) {
      const el = part("3L", "pp" + i);
      const s = i * 0.08, k = sm(s, s + 0.14, p);
      if (i < 2) { op(el, 1); continue; }
      op(el, sm(s, s + 0.05, p)); el.setAttribute("transform", tr(0, 0, 22 * (1 - k)));
    }
  },
  "3R"(p) { for (let i = 0; i < 4; i++) draw(part("3R", "rt" + i), sm(0.12 + i * 0.2, 0.3 + i * 0.2, p)); },
};

const ROW = 4, LEAD = 0.6, HALF = 2, HOLD = 4.4, FADE = 0.9;
const LOOP = LEAD + ROW * 4 + HOLD + FADE;
let shownCount = -1;
function render(t, calm) {
  // t: seconds into the loop
  const reset = sm(LOOP - FADE, LOOP, t);
  let done = 0;
  rows.forEach((row, i) => {
    const t0 = LEAD + i * ROW;
    let pl = sm(t0, t0 + HALF, t), pr = sm(t0 + HALF, t0 + 2 * HALF, t);
    if (calm) pl = pr = 1;
    const state = calm || t >= t0 + 2 * HALF ? "done" : t >= t0 ? "active" : "pending";
    if (row.dataset.state !== state) row.dataset.state = state;
    row.style.opacity = reset > 0 && !calm ? (1 - 0.18 * reset).toFixed(3) : "";
    S[i + "L"](pl, t); S[i + "R"](pr, t);
    if (pr >= 1) done++;
  });
  const n = 4 - done;
  if (n !== shownCount) {
    shownCount = n; countEl.textContent = String(n);
    wd.dataset.count = String(n);
    pips.forEach((pip, i) => pip.classList.toggle("off", i >= n));
  }
}

let frame = 0, last = 0, clock = 0, visible = false;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now; clock = (clock + dt) % LOOP;
  render(clock, false);
  frame = visible ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible && canPlay()) { last = 0; frame = requestAnimationFrame(tick); } };
const canPlay = playback(wd, still, () => queueMicrotask(run), () => {
  if (frame) cancelAnimationFrame(frame);
  frame = 0;
});
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); else if (frame) { cancelAnimationFrame(frame); frame = 0; } }, { rootMargin: "120px 0px" }).observe(wd);
if (still.matches) render(LOOP - FADE - 0.01, true); else render(0, false);
still.addEventListener("change", () => { if (still.matches) { if (frame) cancelAnimationFrame(frame); frame = 0; render(LOOP - FADE - 0.01, true); } else run(); });
window.__wd = { seek: (s) => { clock = s % LOOP; render(clock, false); }, LOOP };
// iframe auto-height
const post = () => { try { window.parent.postMessage({ type: "anatomy-height", height: document.body.scrollHeight }, "*"); } catch (_) {} };
addEventListener("load", post); addEventListener("resize", post);
new ResizeObserver(post).observe(document.body);
post();
</script></body></html>
